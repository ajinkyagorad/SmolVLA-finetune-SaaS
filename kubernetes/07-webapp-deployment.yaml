apiVersion: apps/v1
kind: Deployment
metadata:
  name: smolvla-webapp
  labels:
    app: smolvla-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smolvla-webapp
  template:
    metadata:
      labels:
        app: smolvla-webapp
    spec:
      containers:
      - name: smolvla-webapp
        image: your-registry/smolvla-training-saas:latest  # Replace with your actual image
        imagePullPolicy: Always
        command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "4", "--timeout", "120", "app:app"]
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "app"
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: FLASK_SECRET_KEY
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: DATABASE_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: DATABASE_NAME
        - name: DATABASE_HOST
          value: "postgres-service"
        - name: SQLALCHEMY_DATABASE_URI
          value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: ENCRYPTION_KEY
        - name: UPLOAD_FOLDER
          value: "/training-output"
        resources:
          limits:
            memory: "1Gi"
            cpu: "1"
          requests:
            memory: "512Mi"
            cpu: "0.5"
        volumeMounts:
        - name: training-output
          mountPath: /training-output
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: training-output
        persistentVolumeClaim:
          claimName: smolvla-training-output-pvc
