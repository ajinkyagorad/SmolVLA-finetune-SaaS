apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard # Uncomment and set if you have a specific storage class

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smolvla-training-output-pvc
spec:
  accessModes:
    - ReadWriteMany # Crucial if multiple workers write to common storage
  resources:
    requests:
      storage: 100Gi
  # storageClassName: your-nfs-storage-class # Uncomment and set if you have a specific storage class for ReadWriteMany
