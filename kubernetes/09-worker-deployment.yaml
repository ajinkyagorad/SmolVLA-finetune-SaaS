apiVersion: apps/v1
kind: Deployment
metadata:
  name: smolvla-worker
  labels:
    app: smolvla-worker
spec:
  replicas: 4  # Maximum 4 concurrent workers as per requirements
  selector:
    matchLabels:
      app: smolvla-worker
  template:
    metadata:
      labels:
        app: smolvla-worker
    spec:
      containers:
      - name: smolvla-worker
        image: your-registry/smolvla-training-saas:latest  # Same image as web app
        imagePullPolicy: Always
        command: ["celery", "-A", "app.celery", "worker", "--loglevel=info", "--concurrency=1"]
        env:
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: DATABASE_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: DATABASE_NAME
        - name: DATABASE_HOST
          value: "postgres-service"
        - name: SQLALCHEMY_DATABASE_URI
          value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: smolvla-app-secrets
              key: ENCRYPTION_KEY
        - name: UPLOAD_FOLDER
          value: "/training-output"
        resources:
          limits:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: 1  # Request 1 GPU per worker
          requests:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: 1  # Request 1 GPU per worker
        volumeMounts:
        - name: training-output
          mountPath: /training-output
      volumes:
      - name: training-output
        persistentVolumeClaim:
          claimName: smolvla-training-output-pvc
      # Optional: Add node selector for GPU nodes if needed
      nodeSelector:
        accelerator: nvidia-a100  # Adjust based on your cluster's labeling
